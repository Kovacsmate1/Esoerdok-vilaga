<!DOCTYPE html>
<html lang="hu  ">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="fooldal.css">
    <title>Esőerdő</title>
</head>

<body>
    <header>
        <nav class="navbar sm:navbar-expand bg-1 fg-2">
            <div class="container-fluid">
                <div class="drawer-body">
                    <div class="nav nav-pills navbar-nav">
                        <a class="nav-link" href="#">Főoldal</a>
                        <a class="nav-link" href="#">Features</a>
                        <a class="nav-link" href="#">Features</a>
                        <a class="nav-link" href="#">Pricing</a>
                        <a class="nav-link" href="#">Disabled</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <br>
    <main>
        <section class="m-5">
            <div id="carouselExampleDark" class="justify-content-center carousel carousel-overlay slide"
                data-bs-theme="dark">
                <div class="carousel-inner">
                    <div class="carousel-item active" data-bs-interval="10000">
                        <img src="img/vizeses.jpg" class="d-block w-100 rounded-5" alt="Waterfall">
                    </div>
                    <div class="carousel-item" data-bs-interval="2000">
                        <img src="img/beka.jpg" class="d-block w-100 rounded-5" alt="Frog">
                    </div>
                    <div class="carousel-item">
                        <img src="img/amazonas.jpg" class="d-block w-100 rounded-5" alt="Amazon rainforest">
                    </div>
                    <div class="carousel-item">
                        <img src="img/hid.jpg" class="d-block w-100 rounded-5" alt="Bridge">
                    </div>
                    <div class="carousel-item">
                        <img src="img/papagaly.jpg" class="d-block w-100 rounded-5" alt="Parrot">
                    </div>
                </div>
                <div class="carousel-overlay-controls">
                    <button class="btn-icon btn-sm btn-subtle theme-secondary slidergomb" type="button"
                        data-bs-target="#carouselExampleDark" data-bs-slide="prev">
                        <span class="carousel-icon-prev" aria-hidden="true"></span>
                    </button>
                    <div class="carousel-indicators">
                        <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="0" class="active"
                            aria-current="true" aria-label="Slide 1" class="slidergomb"></button>

                        <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="1"
                            aria-label="Slide 2" class="slidergomb"></button>

                        <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="2"
                            aria-label="Slide 3" class="slidergomb"></button>

                        <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="3"
                            aria-label="Slide 4" class="slidergomb"></button>

                        <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="4"
                            aria-label="Slide 5" class="slidergomb"></button>
                    </div>
                    <button class="btn-icon btn-sm btn-subtle theme-secondary slidergomb" type="button"
                        data-bs-target="#carouselExampleDark" data-bs-slide="next">
                        <span class="carousel-icon-next" aria-hidden="true"></span>
                    </button>
                </div>
            </div>
        </section>
    </main>
    <footer class="text-center">
        <p> &copy Minden jog fenntartva!</p>
    </footer>

</body>

</html>
